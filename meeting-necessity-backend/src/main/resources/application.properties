# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=meeting-necessity-score-backend

# Local H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:meetingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Production PostgreSQL Configuration (uncomment when connecting to real PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/meeting_necessity_db
# spring.datasource.username=postgres
# spring.datasource.password=your_db_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



# Google OAuth credentials used by AuthController's manual OAuth flow.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

# Frontend URL
app.frontend.url=http://localhost:5173

# Encryption Secret for Google OAuth tokens in Database
encryption.secret=${ENCRYPTION_SECRET:local-development-only-change-me}
